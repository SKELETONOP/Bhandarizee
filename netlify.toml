[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: fall back to index.html for any path that isn't a real
# file (the site itself only uses in-page #anchors, but this keeps a
# direct/deep link or a typo'd path from hitting Netlify's 404 page).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything under /assets with a content hash, so it's
# safe to cache those forever — a content change always produces a new
# filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
